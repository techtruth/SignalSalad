name: Unit Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: unit-tests-${{ github.ref_name }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: ${{ matrix.project }} unit tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: [signaling, media]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.project }}/package-lock.json

      - name: Install dependencies
        run: npm --prefix ${{ matrix.project }} ci

      - name: Run unit tests
        run: npm --prefix ${{ matrix.project }} run test:unit
